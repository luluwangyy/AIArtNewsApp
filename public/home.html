<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIrtsy - Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Palatino', Palatino, serif;
            background-color: #f8f8f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            margin-bottom: 40px;
            text-align: center;
        }

        .logo img {
            width: 150px;
            height: auto;
        }

        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .start-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .start-button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .tagline {
            margin-top: 20px;
            color: #666;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="Artsy_logo.svg.png" alt="AIrtsy Logo">
    </div>
    <h1>Welcome to AIrtsy</h1>
    <a href="api.html" class="start-button">Start Creating</a>
    <p class="tagline">Transform your ideas into AI-powered art</p>
</body>
</html>
